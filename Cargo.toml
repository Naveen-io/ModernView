[package]
name = "modernview"
version = "0.1.0"
edition = "2024"
authors = ["ModernView Contributors"]
description = "Fast, Modern Image Viewer & Editor for Windows"
repository = "https://github.com/Naveen-io/ModernView"
license = "MIT OR Apache-2.0"

[dependencies]
slint = "1.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga", "hdr", "pnm", "ff"] }
fast_image_resize = { version = "5", features = ["image"] }
zune-heic = "0.5"
oxideav-avif = "0.0.18"
kamadak-exif = "0.5"
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
crossbeam-channel = "0.5"
chrono = "0.4"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
